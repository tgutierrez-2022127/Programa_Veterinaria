# ============================================================
# MICROSERVICIO: auth-usuario
# Puerto: 8081
# Base de datos: usuarios_db (PostgreSQL)
# ============================================================

# --- Configuracion del servidor ---
server.port=8081
spring.application.name=auth-usuario

# --- Conexion a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/usuarios_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Carga de datos inicial (data.sql) ---
# defer-datasource-initialization: espera a que Hibernate cree las tablas y luego ejecuta data.sql.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Jackson: fechas en formato ISO, no como numeros ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Configuracion de JWT (EL MISMO SECRETO en los 4 microservicios) ---
jwt.secret=MiClaveSecretaSuperLargaParaElProyectoVeterinaria2025JWT
jwt.expiration=3600000

# --- Clave compartida para endpoints internos entre microservicios ---
internal.key=clave-interna-veterinaria-2025

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.veterinaria=DEBUG
