# ============================================================
# MICROSERVICIO: auth-usuario
# Puerto: 8081
# Base de datos: usuarios_db (PostgreSQL)
# ============================================================

# --- Configuración del servidor ---
server.port=8081
spring.application.name=auth-usuario

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/usuarios_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración de JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Configuración de JWT ---
jwt.secret=TWlDbGF2ZVNlY3JldGFTdXBlckxhcmdhUGFyYUVsUHJveWVjdG9WZXRlcmluYXJpYTIwMjVKV1Q=
jwt.expiration=3600000

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.com.veterinaria.auth=DEBUG