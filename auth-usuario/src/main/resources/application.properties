# ============================================================
# MICROSERVICIO: auth-usuario
# Puerto: 8081
# Base de datos: usuarios_db (PostgreSQL)
# ============================================================

# --- Configuración del servidor ---
server.port=8081
spring.application.name=auth-usuario

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/usuarios_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración de JPA / Hibernate ---
# update: crea/actualiza las tablas según las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en la consola (útil para aprender)
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true
# Dialecto específico para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Configuración de JWT ---
# Secreto para firmar los tokens. Debe ser MUY largo (mínimo 32 caracteres).
# ESTE MISMO SECRETO debe estar en los otros 3 microservicios.
jwt.secret=MiClaveSecretaSuperLargaParaElProyectoVeterinaria2025JWT
# Duración del token en milisegundos (1 hora = 3600000 ms)
jwt.expiration=3600000

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.com.veterinaria.auth=DEBUG