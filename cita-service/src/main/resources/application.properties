# ============================================================
# MICROSERVICIO: cita-service
# Puerto: 8083
# Base de datos: citas_db (PostgreSQL)
# ============================================================

server.port=8083
spring.application.name=cita-service

# --- Conexion a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/citas_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT (mismo secreto que los demas microservicios) ---
jwt.secret=MiClaveSecretaSuperLargaParaElProyectoVeterinaria2025JWT
jwt.expiration=3600000

# --- Clave compartida para endpoints internos ---
internal.key=clave-interna-veterinaria-2025

# --- URLs de otros microservicios ---
servicios.auth.url=http://localhost:8081
servicios.mascota.url=http://localhost:8082

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.veterinaria=DEBUG
