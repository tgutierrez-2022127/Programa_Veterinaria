# ============================================================
# API GATEWAY
# Puerto: 8080 (el mismo que espera el script de pruebas / el monolito original)
#
# Si el puerto 8080 esta ocupado (p. ej. por el httpd de PostgreSQL/EDB),
# se puede arrancar en otro puerto sin recompilar:
#     java -jar api-gateway-1.0.0.jar --server.port=8090
# ============================================================

server.port=8080
spring.application.name=api-gateway

# --- Logging ---
logging.level.com.veterinaria=INFO
